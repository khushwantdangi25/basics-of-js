<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="heading"><h1>K-ToDO</h1></div>
            <div class="button"><button>Add</button></div>
        </nav>
        <section class = "main">
            <div class="box">
                <div class="heading">
                    <div class="left">To-Do</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div class="box">
                <div class="heading">
                    <div class="left">Inprogress</div>
                    <div class="right">count</div>
                </div>
            </div>
            <div class="box">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
