<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <form action="">
            <div class="details">
                <h2>Create Account</h2>
                <input id="name" type="text" placeholder="Name">
                <input id="password" type="password" placeholder="Password">
                <input id="photo" type="url" placeholder="Photo link">
                <button type="submit">Submit</button>
            </div>
        </form>

        <div class="card">
            <div class="img">
                <img src="https://images.unsplash.com/photo-1777646378295-c121ecfea209?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxM3x8fGVufDB8fHx8fA%3D%3D" alt="Profile">
            </div>
            <div class="content">
                <h2>Khushwant</h2>
                <h3>be fit</h3>
            </div>
        </div>

    </div>
</body>
</html>
